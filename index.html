<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>Vòng chung kết – Thử thách lật 8 ô</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--d:#4B146B;--p:#7625A8;--l:#A84BD0;--h:#D52AAB;--w:#fff;--bg:#F8F0FF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;background:radial-gradient(ellipse at 20% 0,#7625A8 0,transparent 55%),radial-gradient(ellipse at 90% 100%,#D52AAB 0,transparent 50%),#4B146B;background-attachment:fixed;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:conic-gradient(from 0deg at 50% -20%,transparent 0 20%,rgba(255,255,255,.12) 25%,transparent 30% 70%,rgba(255,255,255,.12) 75%,transparent 80%);animation:sw 9s ease-in-out infinite alternate;pointer-events:none}
@keyframes sw{to{transform:translateX(8%) scale(1.1);opacity:.5}}
main{position:relative;max-width:1400px;margin:0 auto;padding:18px 20px 30px;text-align:center}
.logos{display:inline-flex;gap:clamp(12px,3vw,44px);align-items:center;justify-content:center;flex-wrap:wrap;background:#fff;border-radius:999px;padding:10px clamp(18px,3vw,40px);min-height:64px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.logos img{height:clamp(30px,5.5vw,64px);max-width:28vw;width:auto;object-fit:contain}
.logos .ph{color:var(--p);font-weight:700;font-size:.85rem}
h1{margin:22px 0 24px;font-size:clamp(2rem,6vw,4.6rem);font-weight:900;letter-spacing:.04em;background:linear-gradient(90deg,#fff,#f0b6ff,#D52AAB);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(213,42,171,.7))}
h2{margin:0 0 24px;font-weight:600;letter-spacing:.12em;font-size:clamp(.8rem,2vw,1.3rem);opacity:.9}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,2vw,28px);perspective:1200px}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
.tile{aspect-ratio:16/10;border:0;padding:0;cursor:pointer;background:none;position:relative;transform-style:preserve-3d;transition:transform .7s,filter .2s;font:inherit;color:inherit}
.tile:not(:disabled):hover{transform:translateY(-6px) scale(1.03);filter:drop-shadow(0 0 22px #D52AAB)}
.tile:active:not(:disabled){transform:scale(.97)}
.face{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;border:2px solid rgba(255,255,255,.55)}
.front{background:linear-gradient(145deg,#A84BD0,#7625A8 55%,#4B146B);box-shadow:0 12px 0 #35094f,0 18px 30px rgba(0,0,0,.45),inset 0 0 30px rgba(255,255,255,.2)}
.front b{font-size:clamp(2rem,5vw,4rem);line-height:1;text-shadow:0 0 18px #D52AAB}
.front i{font-style:normal;font-size:clamp(1.2rem,3vw,2.2rem);opacity:.8}
.back{transform:rotateY(180deg);background:linear-gradient(145deg,#2c0a40,#4B146B);box-shadow:inset 0 0 30px rgba(0,0,0,.5);font-weight:800;letter-spacing:.1em;opacity:.8;font-size:clamp(1rem,2.4vw,1.6rem)}
.tile:disabled{cursor:not-allowed;transform:rotateY(180deg)}
.tile.flip{transform:rotateY(180deg) scale(1.1)}
.bar{display:flex;justify-content:center;gap:12px;margin-top:26px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:999px;padding:12px 22px;font:700 1rem inherit;font-family:inherit;cursor:pointer;background:#fff;color:var(--d);box-shadow:0 4px 0 #cfa6e6,0 8px 20px rgba(0,0,0,.3);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn.alt{background:linear-gradient(90deg,var(--p),var(--h));color:#fff;box-shadow:0 4px 0 #35094f}
#full{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%,#7625A8,#2c0a40 75%);z-index:20;padding:env(safe-area-inset-top,0px) 0 0}
#full.on{display:flex;animation:zin .6s ease-out}#full.out{animation:fout .4s ease-in forwards}
@keyframes zin{from{opacity:0;transform:scale(.6)}}@keyframes fout{to{opacity:0}}
#full img{max-width:96vw;max-height:94vh;object-fit:contain;border-radius:10px;box-shadow:0 0 60px 10px rgba(213,42,171,.6)}
#full .none{font-size:1.5rem;opacity:.8}
#home{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));font-size:1.15rem;padding:14px 26px;z-index:2}
#no{position:absolute;right:18px;top:calc(18px + env(safe-area-inset-top,0px));font-weight:700;background:rgba(0,0,0,.35);padding:8px 16px;border-radius:999px}
#adm{position:fixed;inset:0;background:rgba(30,5,45,.92);z-index:30;display:none;overflow:auto;padding:20px}
#adm.on{display:block}.box{max-width:900px;margin:0 auto;background:var(--bg);color:var(--d);border-radius:20px;padding:22px;text-align:left}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:14px 0}
.ag div{background:#fff;border-radius:12px;padding:10px;font-size:.9rem}.ag img{width:100%;height:90px;object-fit:contain;background:#eee;border-radius:8px;display:block;margin:6px 0}
.ag input{width:100%;font-size:.8rem}
#msg{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#fff;color:var(--d);padding:8px 16px;border-radius:999px;font-weight:600;display:none;z-index:40}
.note{font-size:.8rem;opacity:.75;margin-top:14px}

.adminbtn{position:fixed;right:10px;bottom:10px;opacity:.25;border:0;background:none;color:#fff;font-size:1.3rem;cursor:pointer;z-index:5}.adminbtn:hover{opacity:.9}
#adm input[type=password]{padding:10px 14px;border-radius:999px;border:2px solid #A84BD0;font-size:1rem;margin-right:8px}
</style></head><body>
<main>
<div class="logos"><img src="assets/logo-1.png" alt="IUH"><img src="assets/logo-2.png" alt="CLB Lý luận trẻ"><img src="assets/logo-3.png" alt="Thanh niên Hùng Biện"></div>
<h1>VÒNG CHUNG KẾT</h1>
<div class="grid" id="grid"></div>
<div class="bar"><button class="btn" id="snd">🔊 Âm thanh: Bật</button><span id="cnt"></span></div>
</main>
<button class="adminbtn" id="open" title="Admin">⚙</button>
<div id="full"><button class="btn" id="home">🏠 HOME</button><div id="no"></div><img id="pic" alt=""><div class="none" id="none" hidden>Chưa có hình cho ô này</div></div>
<div id="adm"><div class="box">
<h2 style="color:var(--d);letter-spacing:0;margin:0 0 10px">Quản trị</h2>
<div id="login"><input type="password" id="pw" placeholder="Mật khẩu Admin"><button class="btn alt" id="go">Đăng nhập</button></div>
<div id="panel" hidden><p id="stat"></p><div class="bar" style="justify-content:flex-start"><button class="btn" id="reset" style="background:#D52AAB;color:#fff">RESET GAME</button></div></div>
<div class="bar" style="justify-content:flex-start"><button class="btn" id="close">Đóng</button></div>
</div></div>
<div id="msg"></div>
<script>
(function(){
var N=8,KEY="lat8_state_v1",PW_HASH="abee5c674729fe4a9430437b5659e0627424391bd22a543c468c677e1fca21a1",sound=true,ok=false;
var $=function(i){return document.getElementById(i)};
function load(){try{var a=JSON.parse(localStorage.getItem(KEY));return Array.isArray(a)?a:[]}catch(e){return []}}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){say("Không lưu được trạng thái")}}
var opened=load();
function say(t){var m=$("msg");m.textContent=t;m.style.display="block";setTimeout(function(){m.style.display="none"},2500)}
function beep(){if(!sound)return;try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=520;o.frequency.exponentialRampToValueAtTime(900,c.currentTime+.25);g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.3)}catch(e){}}
var g=$("grid");
for(var i=1;i<=N;i++){(function(n){var b=document.createElement("button");b.className="tile";b.id="t"+n;var p=("0"+n).slice(-2);
b.innerHTML='<div class="face front"><b>'+p+'</b><i>?</i></div><div class="face back">ĐÃ MỞ</div>';
b.onclick=function(){pick(n)};g.appendChild(b)})(i)}
function render(){for(var n=1;n<=N;n++){var t=$("t"+n);t.disabled=opened.indexOf(n)>-1;t.classList.remove("flip")}
 $("cnt").textContent="Đã mở "+opened.length+"/8 · Còn "+(N-opened.length);$("stat").textContent="Đã mở: "+opened.length+" · Chưa mở: "+(N-opened.length)}
function show(n){$("no").textContent="Ô số "+("0"+n).slice(-2)+"/08";var im=$("pic");im.style.display="";$("none").hidden=true;
 im.onerror=function(){im.style.display="none";$("none").hidden=false};im.src="assets/anh-0"+n+".jpg";var f=$("full");f.classList.remove("out");f.classList.add("on")}
function pick(n){opened=load();if(opened.indexOf(n)>-1){render();return}
 $("t"+n).classList.add("flip");beep();opened=opened.concat([n]);save(opened);setTimeout(function(){show(n);render()},600)}
function home(){var f=$("full");f.classList.add("out");setTimeout(function(){f.classList.remove("on","out")},400)}
$("home").onclick=home;
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if($("adm").classList.contains("on"))$("adm").classList.remove("on");else home()}});
window.addEventListener("storage",function(e){if(e.key===KEY){opened=load();render()}});
$("snd").onclick=function(){sound=!sound;this.textContent="🔊 Âm thanh: "+(sound?"Bật":"Tắt")};
$("open").onclick=function(){$("adm").classList.add("on");$("login").hidden=ok;$("panel").hidden=!ok};
$("close").onclick=function(){$("adm").classList.remove("on")};
async function sha(s){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
$("go").onclick=async function(){try{if(await sha($("pw").value)===PW_HASH){ok=true;$("pw").value="";$("login").hidden=true;$("panel").hidden=false;render()}else say("Sai mật khẩu")}catch(e){say("Cần mở bằng https")}};
var arm=0,tm;
$("reset").onclick=function(){var b=this;if(!ok)return;
 if(!arm){arm=1;b.textContent="BẤM LẠI ĐỂ XÁC NHẬN RESET";tm=setTimeout(function(){arm=0;b.textContent="RESET GAME"},4000);return}
 clearTimeout(tm);arm=0;b.textContent="RESET GAME";opened=[];save(opened);render();say("Đã reset game")};
render();
})();
</script></body></html>
